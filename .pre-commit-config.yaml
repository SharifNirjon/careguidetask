# pre-commit install   (once)    |   pre-commit run --all-files
# Local hooks run the project's pinned tools (backend/requirements-dev.txt), so
# hook versions never drift from what CI and developers use.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict for app.llm, app.extraction, app.validation, app.api, app.search)
        entry: mypy backend/app/llm backend/app/extraction backend/app/validation backend/app/api backend/app/search
        language: system
        pass_filenames: false
        files: ^backend/app/(llm|extraction|validation|api|search|config\.py)
      - id: detect-secrets
        name: detect-secrets
        entry: detect-secrets-hook --baseline .secrets.baseline
        language: system
        exclude: ^(\.secrets\.baseline|backend/\.venv/)
      - id: no-openrouter-keys
        # detect-secrets only flags keys assigned to secret-looking names; this
        # catches the OpenRouter key shape anywhere (the test fake doesn't match).
        name: forbid OpenRouter API keys
        entry: "sk-or-v1-[0-9a-f]{64}"
        language: pygrep
