services:
  db:
    # pgvector/pgvector ships PostgreSQL 16 with the `vector` extension compiled in.
    # pg_trgm is a contrib extension and is included in the base image.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careguide}
      POSTGRES_DB: ${POSTGRES_DB:-careguide}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
