services:
  db:
    # pgvector/pgvector ships PostgreSQL 16 with the `vector` extension compiled in.
    # pg_trgm is a contrib extension and is included in the base image.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careguide}
      POSTGRES_DB: ${POSTGRES_DB:-careguide}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"  # dev image: also contains pytest so tests run in-container
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env  # OPENROUTER_API_KEY and overrides; gitignored, optional
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-careguide}:${POSTGRES_PASSWORD:-careguide}@db:5432/${POSTGRES_DB:-careguide}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-careguide}:${POSTGRES_PASSWORD:-careguide}@db:5432/careguide_test
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/storage
      OMP_THREAD_LIMIT: "1"
      RUN_LIVE_LLM: ${RUN_LIVE_LLM:-0}
    volumes:
      - storage:/data/storage
      # dev: live code + tests/fixtures/docs so `docker compose run worker pytest` works
      - ./backend:/app/backend
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./docs:/app/docs
      - ./pytest.ini:/app/pytest.ini:ro

volumes:
  pgdata:
  storage:
