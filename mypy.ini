# `mypy backend/app/llm backend/app/extraction` from the repo root.
# Strict for the AI and validation layers; other packages are only type-checked as dependencies.
[mypy]
python_version = 3.11
mypy_path = backend
explicit_package_bases = True
plugins = pydantic.mypy
strict = True
warn_unreachable = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True

[mypy-app.models.*,app.db.*,app.pipeline.*,app.workers.*,app.cli,app.logging_setup]
ignore_errors = True

[mypy-pgvector.*,xlrd.*,olefile.*,pytesseract.*,celery.*,kombu.*,fakeredis.*,openpyxl.*,cv2.*]
ignore_missing_imports = True
